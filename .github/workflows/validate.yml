name: Validate data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Check datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every dataset
        run: python scripts/validate.py

      - name: Check the map bundle is up to date
        run: |
          python viewer/build.py
          if ! git diff --quiet -- viewer/; then
            echo "::error::viewer/ is stale — run 'python viewer/build.py' and commit the result"
            git diff --stat -- viewer/
            exit 1
          fi
          echo "map bundle matches data/"
